<?xml version="1.0" encoding="UTF-8"?>
<!-- S3 Counter, bottom, top. Units: inches, 1:1, sheet 48 x 48. Cut with a 1/4 in downcut bit (see gen_c2d.py). Parts sit 0.5 in apart. -->
<!-- Layers: outside profiles = Cutout, outside the line, through. inside profiles = Contour inside the line, through. -->
<!-- holes = 0.5 in, Contour inside the line with the 1/4 in bit, through. dados = Pocket, 0.25 in deep, inside the outline. -->
<!-- 1 in all round is never cut by a part: hold-down screws go there. Red break lines are on-path through cuts to the edge; cut them LAST with a screw in each leftover. -->
<svg xmlns="http://www.w3.org/2000/svg" width="48in" height="48in" viewBox="0 0 48 48">
  <g id="sheet-outline" fill="none" stroke="#999999" stroke-width="0.02">
    <rect x="0" y="0" width="48" height="48"/>
  </g>
  <g id="hold-down-zones-delete-before-cutting" fill="#dddddd" stroke="none">
    <path fill-rule="evenodd" d="M0 0H48V48H0Z M1 1H47V47H1Z"/>
  </g>
  <g id="dados-pocket-0.25in-deep" fill="none" stroke="#0000ff" stroke-width="0.01">
    <path d="M24.75 1.375H25.485V18.905H24.75V1.375Z"/>
    <path d="M33.97 1.375H34.705V18.905H33.97V1.375Z"/>
    <path d="M22.455 19.155H23.19V36.685H22.455V19.155Z"/>
    <path d="M13.235 19.155H13.97V36.685H13.235V19.155Z"/>
    <path d="M12.32 36.935H13.055V44.965H12.32V36.935Z"/>
    <path d="M23.61 36.935H24.345V44.965H23.61V36.935Z"/>
    <path d="M34.9 36.935H35.635V44.965H34.9V36.935Z"/>
  </g>
  <g id="holes-drill-0.5in-through" fill="none" stroke="#ff00ff" stroke-width="0.01">
    <circle cx="36.54" cy="2.8" r="0.25"/>
    <circle cx="39.14" cy="2.8" r="0.25"/>
    <circle cx="41.74" cy="2.8" r="0.25"/>
    <circle cx="44.34" cy="2.8" r="0.25"/>
  </g>
  <g id="inside-profiles-contour-inside-through" fill="none" stroke="#008800" stroke-width="0.01">
    <path d="M11.375 3.3125H22.75A1.5 1.5 0 0 1 24.25 4.8125V16.1875A1.5 1.5 0 0 1 22.75 17.6875H11.375A1.5 1.5 0 0 1 9.875 16.1875V4.8125A1.5 1.5 0 0 1 11.375 3.3125Z"/>
    <path d="M7.05 10.595H7.05A0.75 0.75 0 0 1 7.8 11.345V11.345A0.75 0.75 0 0 1 7.05 12.095H7.05A0.75 0.75 0 0 1 6.3 11.345V11.345A0.75 0.75 0 0 1 7.05 10.595Z"/>
  </g>
  <g id="outside-profiles-cutout-through" fill="none" stroke="#000000" stroke-width="0.01">
    <path d="M1.5 1.5H46.44V18.78H1.5V1.5Z"/>
    <path d="M1.5 19.28H25.24V30.5H35.74V19.28H46.44V36.56H1.5Z"/>
    <path d="M1.5 37.06H46.44V44.84H1.5V37.06Z"/>
  </g>
  <g id="break-lines-on-path-through-cut-last" fill="none" stroke="#ff0000" stroke-width="0.01">
    <line x1="47.19" y1="0" x2="47.19" y2="48"/>
    <line x1="0" y1="45.59" x2="48" y2="45.59"/>
  </g>
  <g id="labels-delete-before-cutting" fill="#888888" font-family="Helvetica, Arial, sans-serif" font-size="0.6">
    <text x="2" y="2.6">COUNTER  44 15/16 × 17 9/32  FACE DOWN</text>
    <text x="2" y="20.38">BOTTOM  44 15/16 × 17 9/32</text>
    <text x="2" y="38.16">TOP  44 15/16 × 7 25/32  FACE DOWN</text>
    <text x="24" y="47.7" text-anchor="middle">1 IN HOLD-DOWN BORDER ALL ROUND, SCREWS HERE, NO PARTS</text>
  </g>
</svg>
