    <path d="M37.47 42.3563H38.125V45.0162H37.47A0.25 0.25 0 0 1 37.22 44.7662V42.6063A0.25 0.25 0 0 1 37.47 42.3563Z"/>
    <path d="M37.47 38.2338H38.125V40.8937H37.47A0.25 0.25 0 0 1 37.22 40.6437V38.4838A0.25 0.25 0 0 1 37.47 38.2338Z"/>
  </g>
  <g id="holes-drill-0.5in-through" fill="none" stroke="#ff00ff" stroke-width="0.01">
