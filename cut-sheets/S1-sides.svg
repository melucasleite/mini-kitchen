    <path d="M20.595 12.25H28.625V12.985H20.595V12.25Z"/>
    <path d="M20.595 1.375H28.625V2.235H20.595V1.375Z"/>
    <path d="M20.595 36.75H36.75A0.25 0.25 0 0 1 37 37V37.235A0.25 0.25 0 0 1 36.75 37.485H20.595V36.75Z"/>
  </g>
  <g id="recesses-and-dimples-pocket-0.055in-deep" fill="none" stroke="#00aaaa" stroke-width="0.01">
    <path d="M1.375 42.3563H2.03A0.25 0.25 0 0 1 2.28 42.6063V44.7662A0.25 0.25 0 0 1 2.03 45.0162H1.375V42.3563Z"/>
