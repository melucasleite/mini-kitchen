<?xml version="1.0" encoding="UTF-8"?>
<!-- S5 Doors, upper shelf. Units: inches, 1:1, sheet 48 x 48. Cut with a 1/4 in downcut bit (see gen_c2d.py). Parts sit 0.5 in apart. -->
