<text x="9.250" y="6.700" style="font-family:Helvetica, Arial, sans-serif;font-size:0.24px;font-weight:700;fill:#5a605c;text-anchor:end">dashed line: the printed</text>
<text x="9.250" y="7.020" style="font-family:Helvetica, Arial, sans-serif;font-size:0.24px;font-weight:700;fill:#5a605c;text-anchor:end">wiring box, over the cord hole</text>
<text x="10.850" y="2.170" style="font-family:Helvetica, Arial, sans-serif;font-size:0.2px;font-weight:700;fill:#1e2422;text-anchor:start">+12V</text>
<text x="11.650" y="4.270" style="font-family:Helvetica, Arial, sans-serif;font-size:0.2px;font-weight:700;fill:#1e2422;text-anchor:start">GND</text>
<text x="12.600" y="6.120" style="font-family:Helvetica, Arial, sans-serif;font-size:0.2px;font-weight:700;fill:#1e2422;text-anchor:end">85</text>
<text x="19.050" y="4.550" style="font-family:Helvetica, Arial, sans-serif;font-size:0.2px;font-weight:700;fill:#1e2422;text-anchor:end">PUMP+</text>
<text x="22.000" y="8.200" style="font-family:Helvetica, Arial, sans-serif;font-size:0.38px;font-weight:700;fill:#1e2422;text-anchor:start">How it works</text>
<text x="22.000" y="8.800" style="font-family:Helvetica, Arial, sans-serif;font-size:0.28px;font-weight:400;fill:#1e2422;text-anchor:start">The relay's coil is fed through both floats in series.</text>
<text x="22.000" y="9.220" style="font-family:Helvetica, Arial, sans-serif;font-size:0.28px;font-weight:400;fill:#1e2422;text-anchor:start">Both closed (water in the clean jug, room in the dirty jug):</text>
<text x="22.000" y="9.640" style="font-family:Helvetica, Arial, sans-serif;font-size:0.28px;font-weight:400;fill:#1e2422;text-anchor:start">the coil pulls in, 30 connects to 87, the pump gets +12 V.</text>
<text x="22.000" y="10.060" style="font-family:Helvetica, Arial, sans-serif;font-size:0.28px;font-weight:400;fill:#1e2422;text-anchor:start">Either float open: the coil drops out, the pump goes dead.</text>
<text x="22.000" y="10.480" style="font-family:Helvetica, Arial, sans-serif;font-size:0.28px;font-weight:400;fill:#1e2422;text-anchor:start">The pump's own pressure switch then runs it only while</text>
<text x="22.000" y="10.900" style="font-family:Helvetica, Arial, sans-serif;font-size:0.28px;font-weight:400;fill:#1e2422;text-anchor:start">the tap is open. The floats only ever carry the coil's</text>
<text x="22.000" y="11.320" style="font-family:Helvetica, Arial, sans-serif;font-size:0.28px;font-weight:400;fill:#1e2422;text-anchor:start">~150 mA; the relay carries the pump's 6 A.</text>
<text x="22.000" y="11.740" style="font-family:Helvetica, Arial, sans-serif;font-size:0.28px;font-weight:400;fill:#1e2422;text-anchor:start"></text>
<text x="22.000" y="12.160" style="font-family:Helvetica, Arial, sans-serif;font-size:0.28px;font-weight:400;fill:#1e2422;text-anchor:start">In the box, one lever connector per labelled slot, relay</text>
<text x="22.000" y="12.580" style="font-family:Helvetica, Arial, sans-serif;font-size:0.28px;font-weight:400;fill:#1e2422;text-anchor:start">leads on the single ends: GND, +12V and SERIES 1-in-2-out;</text>
<text x="22.000" y="13.000" style="font-family:Helvetica, Arial, sans-serif;font-size:0.28px;font-weight:400;fill:#1e2422;text-anchor:start">PUMP+, 85 and 87a (a cap) 1-in-1-out. At each jug, 1-in-1-out</text>
<text x="22.000" y="13.420" style="font-family:Helvetica, Arial, sans-serif;font-size:0.28px;font-weight:400;fill:#1e2422;text-anchor:start">connectors where the float and the run meet its plug.</text>
<text x="22.000" y="13.840" style="font-family:Helvetica, Arial, sans-serif;font-size:0.28px;font-weight:400;fill:#1e2422;text-anchor:start">Wires that cross without a connector are not joined.</text>
<text x="22.000" y="14.260" style="font-family:Helvetica, Arial, sans-serif;font-size:0.28px;font-weight:400;fill:#1e2422;text-anchor:start">Each 2-pin plug lets its jug leave the cabinet.</text>
<text x="22.000" y="14.680" style="font-family:Helvetica, Arial, sans-serif;font-size:0.28px;font-weight:400;fill:#1e2422;text-anchor:start">Relay socket wire colours vary: go by the pin numbers</text>
<text x="22.000" y="15.100" style="font-family:Helvetica, Arial, sans-serif;font-size:0.28px;font-weight:400;fill:#1e2422;text-anchor:start">moulded on the socket, not the colours.</text>
