<text x="12.200" y="16.300" style="font-family:Helvetica, Arial, sans-serif;font-size:0.28px;font-weight:400;fill:#1e2422;text-anchor:start">switched +12 V to the pump</text>
<polyline points="16.400,16.200 17.200,16.200" fill="none" stroke="#2456a4" stroke-width="0.1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="17.400" y="16.300" style="font-family:Helvetica, Arial, sans-serif;font-size:0.28px;font-weight:400;fill:#1e2422;text-anchor:start">float loop, to relay coil 85</text></svg>